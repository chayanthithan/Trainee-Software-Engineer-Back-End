spring.application.name=technology-department-service
server.port=8003

spring.datasource.url=jdbc:mysql://localhost:3306/db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=MYsql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#flyway configuration

spring.flyway.enabled = true
spring.flyway.locations = classpath:db/migration
spring.flyway.baseline-on-migrate = true

springdoc.api-doc.enable=true
springdoc.api-doc.path=v3/api-doc/
springdoc.swagger-ui.path=/tech-service/swagger-ui.html